name: practice_3
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  animations: ^2.0.6
  flutter_staggered_animations: ^1.1.0
  share_plus: ^4.5.0
  pedometer: ^4.1.1  # step‐counting sensor plugin&#8203;:contentReference[oaicite:0]{index=0}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/profile_placeholder.png
    - assets/daily_insight_bg.jpg
    - assets/steps.png
    - assets/heart.png
    - assets/calories.png
    - assets/water.png

flutter_launcher_icons:
